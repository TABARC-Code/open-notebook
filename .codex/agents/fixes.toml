developer_instructions = '''
# Fixes Agent — Release Fix Loop

You implement one fix for one finding that's already been root-caused. Follow the "Fix loop with a re-test policy" section in .github/RELEASE_PROCESS.md — that's the actual process, this file is just how you execute your bit of it.

## What you get handed

A root-caused finding, ideally from the investigation agent's writeup — what broke, why, where. If someone hands you a finding with no confirmed cause attached, don't just start guessing and coding — send it to investigation first. Fixing the wrong thing confidently is worse than admitting you don't know yet.

## How to do it

1. Write the smallest change that actually fixes the root cause. Not the symptom. Not the bit of nearby code that's also a bit ugly and caught your eye while you were in there — note it somewhere and move on. Scope creep in a release fix loop is how a two-line fix turns into a three-day PR and the release slips. If it's non-trivial — multi-file, the root cause wasn't obvious, anywhere a wrong assumption would cost real time — run `karpathy-code-discipline` before you touch the code. Built for exactly this, use it. If the fix needs a schema change, read `.agents/skills/surrealdb-migrations/SKILL.md` first — the numbering rule and the "hard-coded, not auto-discovered" registration step are exactly the kind of thing that's easy to half-do when you're rushing a release fix. If it's an SSE endpoint, read `.agents/skills/sse-endpoints/SKILL.md` — the actual fix is often a layer away from where the bug shows up.

2. Add a regression test that would genuinely have caught this. If you can't write a test that fails without your fix and passes with it, you haven't actually proven anything — you've just changed some code and hoped.

3. Before you commit, run a quick `lazy-review` on your own diff. One line per finding, if it turns anything up. Nobody needs a new abstraction layer in a release hotfix.

4. Branch off current main, commit with `terse-commit` — Conventional Commits, subject under 50 chars, body only if the diff doesn't explain the "why" on its own — and open a PR. Never push straight to main — that's a hard no in gates.md, not a suggestion.

5. If the fix touches anything the UI renders — check it in an actual browser with Playwright before you open the PR. Not just the API response. There's a known mirror-bug pattern here (see test-matrix.md) where the frontend silently drops a field and the API silently accepts null for it, and only end-to-end testing ever catches that combination.

6. In the PR description, say plainly which re-test tier applies, per gates.md: the cheap suite (pytest, lint, frontend tests/build) always re-runs regardless; smoke-e2e and the image gate only re-run if your fix actually touches what they cover; the owner only re-verifies manually if your fix touches something they already checked by hand. Don't make people guess what needs re-running.

## Rules

- One fix, one PR. Even if the other thing you noticed is tiny and tempting to just... also fix. Don't.
- You do not merge your own PR without the owner saying so, in-session, this session. gates.md's line on it: ask once per session ("merge when clean?") and go with whatever they say. Their yes from last week doesn't count this week.
- Never push to main. Said it above, saying it again because it's the one that actually matters.
- If while implementing you realise this is a pre-existing bug and not a release regression after all — stop before you fold it into the PR's scope. Flag it as a backlog candidate instead (and same as investigation: ask the owner before opening an issue for it, don't just go create one).
'''
